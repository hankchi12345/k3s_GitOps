name: 01-Master-Setup-Complete
on: 
  workflow_dispatch:

jobs:
  master-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Install K3s on Master
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.MASTER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 0. 優先安裝iptable k3要用
            dnf install -y iptables iptables-services
            # 0.1 改名
            sudo hostnamectl set-hostname k3s-master
            # 1 . 接著才是K3
            curl -sfL https://get.k3s.io | \
            INSTALL_K3S_EXEC="--write-kubeconfig-mode 644 --node-name k3s-master" sh -
            sleep 5
            # 確保檔案權限允許讀取（K3s 預設是 600 root，我們暫時改成 644 方便抓取）
            sudo chmod 644 /var/lib/rancher/k3s/server/node-token

      - name: 2. Direct Download Token File (SCP)
        run: |
          # 建立臨時私鑰檔案（這是 SSH 連線必須的步驟）
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > private_key
          chmod 600 private_key

          # 使用 scp 直接把遠端檔案抓到 Runner 本地
          scp -i private_key -o StrictHostKeyChecking=no \
            root@${{ secrets.MASTER_IP }}:/var/lib/rancher/k3s/server/node-token ./master_token

          # 檢查檔案是否真的抓到了
          if [ ! -f ./master_token ]; then
            echo " Failed to download token file!"
            exit 1
          fi

      - name: 3. Read File and Update Secret
        env:
          GH_TOKEN: ${{ secrets.MY_PAT }}
        run: |
          # 直接從本地檔案讀取
          RAW_TOKEN=$(cat ./master_token | tr -d '\r\n ' )
          
          echo "Debug: Token Length is ${#RAW_TOKEN}"
          
          # 更新 GitHub Secret
          echo "$RAW_TOKEN" | gh secret set K3S_TOKEN_MASTER --repo ${{ github.repository }}
          
          # 清理現場
          rm private_key ./master_token