name: 01-Master-Setup
on: 
  workflow_dispatch:

jobs:
  setup-master:
    runs-on: ubuntu-latest
    steps:
      - name: Install K3s and Update Secret
        uses: appleboy/ssh-action@master
        id: master_ssh
        with:
          host: ${{ secrets.MASTER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. 安裝 K3s
            curl -sfL https://get.k3s.io | sh -
            
            # 2. 取得 Token 並透過一個暫存檔傳出
            sudo cat /var/lib/rancher/k3s/server/node-token > /tmp/k3s_token
            chmod 644 /tmp/k3s_token

      - name: Fetch Token from Master
        run: |
          # 1. 將 Secret 寫入實體檔案
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > private_key
          
          # 2. 嚴格限制私鑰權限（否則 SSH 會報錯拒絕連線）
          chmod 600 private_key
          
          # 3. 執行 SSH 抓取 Token
          # 注意：這裡使用 -i 指定剛剛建立的檔案
          RAW_TOKEN=$(ssh -i private_key -o StrictHostKeyChecking=no root@${{ secrets.MASTER_IP }} 'cat /tmp/k3s_token')
          
          if [ -z "$RAW_TOKEN" ]; then
            echo "Error: Failed to fetch token"
            exit 1
          fi
          
          # 4. 寫入 GITHUB_ENV 供下一個 Step (Update Secret) 使用
          echo "K3S_TOKEN_VAL=$RAW_TOKEN" >> $GITHUB_ENV
          
          # 5. 安全起見，刪除暫存的私鑰
          rm private_key

      - name: Update GitHub Secret via CLI
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }} # 需具備 repo 權限的 PAT
        run: |
          # 使用 GitHub CLI 直接更新 Secret，這不會顯示在 Log 中
          gh secret set K3S_TOKEN --body "${{ env.K3S_TOKEN_VAL }}" --repo ${{ github.repository }}