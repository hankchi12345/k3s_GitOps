name: 01-Master-Setup
on: 
  workflow_dispatch:

jobs:
  setup-master:
    runs-on: ubuntu-latest
    steps:
      - name: Install K3s and Prepare Token
        uses: appleboy/ssh-action@master
        id: k3s_setup  # 給這一步一個 ID，方便後面抓資料
        with:
          host: ${{ secrets.MASTER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 安裝 K3s
            curl -sfL https://get.k3s.io | sh -
            
            # 等待一下確保 Token 檔案已產生
            sleep 5
            
            # 直接把 Token 印在畫面上，這會被 stdout 抓到
            sudo cat /var/lib/rancher/k3s/server/node-token

      - name: Update GitHub Secret
        # 關鍵在於這裡的 env 設定！
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 從上一步的 stdout 取得 Token
          # 注意：id 要對應上面設定的 k3s_setup
          RAW_TOKEN="${{ steps.k3s_setup.outputs.stdout }}"
          
          # 清洗資料（移除換行），然後直接寫入 Secret
          echo "$RAW_TOKEN" | tr -d '\n' | gh secret set K3S_TOKEN --repo ${{ github.repository }}