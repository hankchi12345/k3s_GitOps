name: 01-Master-Setup
on: 
  workflow_dispatch:

jobs:
  setup-master:
    runs-on: ubuntu-latest
    steps:
      - name: Install K3s and Update Secret
        uses: appleboy/ssh-action@master
        id: master_ssh
        with:
          host: ${{ secrets.MASTER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. 安裝 K3s
            curl -sfL https://get.k3s.io | sh -
            
            # 2. 取得 Token 並透過一個暫存檔傳出
            sudo cat /var/lib/rancher/k3s/server/node-token > /tmp/k3s_token
            chmod 644 /tmp/k3s_token

      - name: Fetch Token from Master to Action Runner
        run: |
          # 使用 scp 將 token 抓回到 GitHub Runner 的環境變數中
          echo "K3S_TOKEN_VAL=$(ssh -i private_key -o StrictHostKeyChecking=no root@${{ secrets.MASTER_IP }} 'cat /tmp/k3s_token')" >> $GITHUB_ENV

      - name: Update GitHub Secret via CLI
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }} # 需具備 repo 權限的 PAT
        run: |
          # 使用 GitHub CLI 直接更新 Secret，這不會顯示在 Log 中
          gh secret set K3S_TOKEN --body "${{ env.K3S_TOKEN_VAL }}" --repo ${{ github.repository }}