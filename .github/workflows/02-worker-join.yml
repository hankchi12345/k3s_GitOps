name: 02-Worker-Join-Final
on: 
  workflow_dispatch:

jobs:
  join-cluster:
    runs-on: ubuntu-latest
    steps:
      - name: Join K3s Worker
        uses: appleboy/ssh-action@master
        
        env:
          K3S_TOKEN_MASTER: ${{ secrets.K3S_TOKEN_MASTER }}
          MASTER_IP: ${{ secrets.MASTER_IP }}
        with:
          host: ${{ secrets.WORKER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          
          envs: K3S_TOKEN_MASTER, MASTER_IP
          script: |
            # --- 診斷區 ---
            echo "檢查變數是否抵達遠端..."
            echo "Master IP: $MASTER_IP"
            echo "Token 長度: ${#K3S_TOKEN_MASTER}"

            if [ ${#K3S_TOKEN_MASTER} -lt 10 ]; then
              echo " 變數傳遞失敗！請檢查 env: 與 secrets 名稱是否對應。"
              exit 1
            fi

            # --- 執行區 ---
            # 1. 補齊工具
            dnf install -y iptables iptables-services
            hostnamectl set-hostname k3s-worker-01

            # 2. 清理舊 Catch (你擔心的快取問題)
            /usr/local/bin/k3s-agent-uninstall.sh || true
            rm -rf /etc/rancher/k3s /var/lib/rancher/k3s

            # 3. 安裝 (使用 Inline Prefix 確保變數鎖死)
            curl -sfL https://get.k3s.io | \
            K3S_URL="https://${MASTER_IP}:6443" \
            K3S_TOKEN="${K3S_TOKEN_MASTER}" \
            sh -s - agent