name: 02-Worker-Join
on: 
  workflow_dispatch: # 手動觸發

jobs:
  join-cluster:
    runs-on: ubuntu-latest
    steps:
      - name: Join Worker to K3s Cluster
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.WORKER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. 補齊工具與終極清理 (確保不會遇到 Status 4)
            sudo dnf install -y iptables iptables-services
            /usr/local/bin/k3s-uninstall.sh || true
            sudo rm -rf /etc/rancher/k3s /var/lib/rancher/k3s /var/lib/kubelet
            sudo ip link delete cni0 || true
            sudo ip link delete flannel.1 || true
            
            # 2. 安裝 Master (最乾淨的參數，不加任何標籤)
            curl -sfL https://get.k3s.io | \
            INSTALL_K3S_EXEC="server --write-kubeconfig-mode 644 --cluster-init" sh -
            
            # 3. 等待啟動與確認 Token
            sleep 10
            sudo cat /var/lib/rancher/k3s/server/node-token