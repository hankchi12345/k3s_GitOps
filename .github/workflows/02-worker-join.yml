name: 02-Worker-Join
on: 
  workflow_dispatch: # 手動觸發

jobs:
  join-cluster:
    runs-on: ubuntu-latest
    steps:
      - name: Join Worker to K3s Cluster
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.WORKER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. 補齊工具
            sudo dnf install -y iptables iptables-services
            
            # 2. 【最重要】先正名
            sudo hostnamectl set-hostname k3s-worker-01
            
            # 3. 徹底清理
            /usr/local/bin/k3s-agent-uninstall.sh || true
            sudo rm -rf /etc/rancher/k3s /var/lib/rancher/k3s
            
            # 4. 變數準備
            TOKEN=$K3S_TOKEN_MASTER
            URL="https://$MASTER_IP:6443"
            
            # 5. 加入叢集
            curl -sfL https://get.k3s.io | K3S_URL=$URL K3S_TOKEN=$TOKEN sh -